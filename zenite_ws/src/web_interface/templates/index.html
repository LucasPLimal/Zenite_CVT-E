<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zênite — Interface Web</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  <header>
    <h1>🛰️ Zênite — Interface Web</h1>
    <div class="badges">
      <span id="conn-badge" class="badge off">Desconectado</span>
      <span id="homog-badge" class="badge off">Sem calibração</span>
    </div>
  </header>

  <main>
    <section class="video-panel">
      <div class="canvas-wrap">
        <canvas id="video-canvas" width="640" height="480"></canvas>
        <div id="no-video" class="no-video">Aguardando imagem da câmera…</div>
      </div>
      <p class="hint">Clique na imagem para enviar o robô até o ponto desejado.</p>
    </section>

    <aside class="side-panel">
      <section class="card">
        <h2>Telemetria</h2>
        <div class="telemetry">
          <div><span class="label">Posição atual</span><span id="pose-value">—</span></div>
          <div><span class="label">Último alvo</span><span id="goal-value">—</span></div>
        </div>
      </section>

      <section class="card">
        <h2>Ajustes da câmera</h2>
        <div class="slider-row">
          <label for="brightness">Brilho</label>
          <input type="range" id="brightness" min="0" max="255" value="150">
          <span id="brightness-value">150</span>
        </div>
        <div class="slider-row">
          <label for="saturation">Saturação</label>
          <input type="range" id="saturation" min="0" max="255" value="172">
          <span id="saturation-value">172</span>
        </div>
        <div class="slider-row">
          <label for="hue">Hue</label>
          <input type="range" id="hue" min="0" max="255" value="255">
          <span id="hue-value">255</span>
        </div>
      </section>

      <section class="card">
        <h2>Calibração</h2>
        <p class="small">A homografia é gerada pelo <code>calibration_node</code> (scale.yaml).</p>
        <button id="reload-homography">Recarregar homografia</button>
      </section>

      <section class="card">
        <h2>Mensagens</h2>
        <ul id="log" class="log"></ul>
      </section>
    </aside>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
</body>
</html>
