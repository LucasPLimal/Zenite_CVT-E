<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zênite — Interface Web</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
  <link rel="stylesheet" href="../static/style.css">
</head>

<body>
  <main>
    <section class="video-section">
      <div>
        <canvas id="video-canvas"></canvas>
      </div>
      <div class="badges">
        <span id="conn-badge" class="error">Desconectado</span>
        <span id="cam-badge" class="error">Câmera desconectada</span>
        <span id="homog-badge" class="error">Sem calibração</span>
        <span id="loc-badge" class="error">robô não localizado</span>
      </div>
      <div class="console">
        <h2>Console</h2>
        <code id="log" class="log">
        </code>
      </div>
    </section>
    <section>
      <nav>
        <button type="button" class="selected" data-target="calibration">Calibração</button>
        <button type="button" data-target="camera">Câmera</button>
        <button type="button" data-target="telemetry">Telemetria</button>
      </nav>

      <div id="calibration" class="block">
        <h2>Telemetria</h2>
        <div class="telemetry">
          <div><span class="label">Posição atual</span><span id="pose-value">—</span></div>
          <div><span class="label">Último alvo</span><span id="goal-value">—</span></div>
        </div>
      </div>

      <div id="camera" class="hidden">
        <h2>Ajustes da câmera</h2>
        <div class="slider-row">
          <label for="brightness">Brilho</label>
          <input type="range" id="brightness" min="0" max="255" value="150">
          <span id="brightness-value">150</span>
        </div>
        <div class="slider-row">
          <label for="saturation">Saturação</label>
          <input type="range" id="saturation" min="0" max="255" value="172">
          <span id="saturation-value">172</span>
        </div>
        <div class="slider-row">
          <label for="hue">Hue</label>
          <input type="range" id="hue" min="0" max="255" value="255">
          <span id="hue-value">255</span>
        </div>
      </div>

      <div id="telemetry" class="hidden">
        <h2>Calibração</h2>
        <p class="small">A homografia é gerada pelo <code>calibration_node</code> (scale.yaml).</p>
        <button id="reload-homography">Recarregar homografia</button>
      </div>


    </section>
  </main>

  <script src="{{ url_for('static', path='app.js') }}"></script>
  <script src="../static/app.js"></script>
</body>

</html>
